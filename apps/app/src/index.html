<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>SLIM – Schiesslärmimmissions-Management</title>
    <base href="/" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="robots" content="noindex" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1d2025"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Apply the stored theme before the first paint (no light→dark flash).
         A file, not an inline script: the Content-Security-Policy of the API
         (`securityHeaders()` in @api-slim/common) allows scripts from the own
         origin only. -->
    <script src="theme-init.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

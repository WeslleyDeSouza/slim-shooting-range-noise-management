<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>SLIM – Schiesslärmimmissions-Management</title>
    <base href="/" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="robots" content="noindex" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d2025" media="(prefers-color-scheme: dark)" />

    <!-- Apply the stored theme before the first paint (no light→dark flash).
         Same key and attributes as SlimThemeService (@ui-slim/design-system). -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('slim.theme');
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (mode === 'dark' || mode === 'light') root.setAttribute('data-theme', mode);
          root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* private mode: CSS falls back to prefers-color-scheme */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

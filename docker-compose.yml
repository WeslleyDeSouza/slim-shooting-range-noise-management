version: '3.7'
services:
  app-db:
    container_name: app-slim-db
    image: mariadb:11.8
    restart: no
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_USER: ${DB_USERNAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - app-slim:/var/lib/mysql
volumes:
  app-slim:
